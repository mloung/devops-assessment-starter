# Skeleton CI pipeline — fill in the steps.
# On push, GitHub runs this on free runners (no cloud account needed). The `postgres`
# service below is your ephemeral migration target — this CI run is the "deploy".
name: ci

on: [push]

jobs:
  build-test-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t orders-api:${{ github.sha }} .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app + test dependencies
        run: pip install -r app/requirements.txt -r requirements-test.txt

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load baseline schema
        run: psql "$DB_URL" -f schema.sql

      - name: Run database migrations
        run: python migrations/run_migrations.py

      - name: Run tests
        run: pytest app/tests -v

      - name: Smoke-test the built container
        run: |
          docker run -d --network host --name app-smoke -e DB_URL="$DB_URL" orders-api:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "app is healthy"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          docker logs app-smoke
          docker stop app-smoke
